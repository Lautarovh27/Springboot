<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Document</title>
</head>
<body>
    <h1 th:text="${title}">"Lista de usuarios"</h1>
    <div th:if="${users.isEmpty()}">
        <p>No tiene usuarios registrados</p>
    </div>
    <table th:if="${!users.isEmpty()}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}">Nombre</td>
                <td th:text="${user.lastname}">Apellido</td>
                <td th:if="${user.email}" th:text="${user.email}">Email</td>
                <td th:if="${user.email == null}" th:text="${'Email no disponible'}">Email</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
